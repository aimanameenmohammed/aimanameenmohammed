name: README Auto Update

on:
  push:
    branches:
      - master
      - main
  schedule:
    - cron: '0 0 * * *'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: "REPO-LIST"
          feed_list: "https://github.com/aimanameenmohammed.atom"
          max_post_count: 5
